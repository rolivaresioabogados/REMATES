<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Remates" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Remates</title>
  <style>
    :root {
      --bg: #0b1220; --surface: #111c2d; --surface2: #172236; --border: #1e3050;
      --accent: #f97316; --accent2: #fbbf24; --text: #e2eaf5; --muted: #64748b;
      --font: Calibri, 'Calibri', 'Gill Sans', sans-serif;
      --mono: 'Courier New', Courier, monospace;
      --radius: 12px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* HEADER */
    #appHeader {
      padding: calc(14px + var(--safe-top)) 18px 14px;
      background: #0b1220;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #ea580c); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .logo-text span { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 15px; cursor: pointer; font-family: var(--font); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 14px; }
    #searchInput { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 11px 11px 36px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; }
    #searchInput:focus { border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    /* FILTER BARS */
    #filterBars { background: #0b1220; border-bottom: 1px solid var(--border); z-index: 99; }
    .bar-row { display: flex; gap: 10px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .bar-row::-webkit-scrollbar { display: none; }

    /* CHIPS (multi select) */
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .chip .n { font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.2); padding: 1px 7px; border-radius: 100px; min-width: 24px; text-align: center; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #0b1220; }

    .chip.c-prox { color: #10b981; border-color: rgba(16,185,129,0.4); }
    .chip.c-prox.active { background: #10b981; border-color: #10b981; color: #fff; }
    .chip.c-proxremate { color: #fff; background: linear-gradient(135deg, #f97316, #ea580c); border-color: #f97316; box-shadow: 0 0 12px rgba(249,115,22,0.4); }
    .chip.c-proxremate.active { background: #fbbf24; border-color: #fbbf24; color: #0b1220; box-shadow: 0 0 18px rgba(251,191,36,0.6); }
    .chip.c-pasado { color: #64748b; border-color: rgba(100,116,139,0.4); }
    .chip.c-pasado.active { background: #64748b; border-color: #64748b; color: #fff; }
    .chip.c-zoom { color: #3b82f6; border-color: rgba(59,130,246,0.4); }
    .chip.c-zoom.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .chip.c-decsi { color: #10b981; border-color: rgba(16,185,129,0.4); }
    .chip.c-decsi.active { background: #10b981; border-color: #10b981; color: #fff; }
    .chip.c-decver { color: #fbbf24; border-color: rgba(251,191,36,0.4); }
    .chip.c-decver.active { background: #fbbf24; border-color: #fbbf24; color: #0b1220; }

    /* DEMANDANTE BTNS (con contador dinámico) */
    .abog-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.15s;
    }
    .abog-btn .n { font-size: 10px; font-weight: 800; background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 100px; min-width: 20px; text-align: center; transition: all 0.15s; }
    .abog-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(249,115,22,0.07); }
    .abog-btn.active .n { background: rgba(249,115,22,0.2); }

    /* MAIN */
    main { flex: 1; padding: 14px 14px calc(16px + var(--safe-bottom)); overflow-y: auto; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; cursor: pointer; position: relative; overflow: hidden; transition: opacity 0.15s, box-shadow 0.2s, border-color 0.2s; }
    .card.dec-si { border-color: #10b981; box-shadow: 0 0 0 1px #10b981, 0 0 16px rgba(16,185,129,0.45); }
    .card.dec-no { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444, 0 0 16px rgba(239,68,68,0.45); }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sc, var(--muted)); }
    .card:active { opacity: 0.75; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .card-fecha-big { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: 0.3px; line-height: 1.2; flex: 1; text-transform: uppercase; }
    .card-hora { font-size: 13px; font-weight: 700; color: var(--text); font-family: var(--mono); margin-left: 4px; }
    .card-name { font-size: 14px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
    .sbadge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-sub { font-size: 11px; font-family: var(--mono); color: var(--muted); margin-bottom: 9px; line-height: 1.5; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .tag.hl { color: var(--accent); border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.07); }
    .tag.zoom { color: #3b82f6; border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.07); }
    .tag.dec-si { color: #10b981; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.07); }
    .tag.dec-ver { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.07); }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .cg-item { display: flex; flex-direction: column; gap: 1px; }
    .cg-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .cg-val { font-size: 12px; color: var(--text); font-family: var(--mono); }
    .card-foot { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cmonto { font-size: 14px; font-weight: 700; font-family: var(--mono); color: var(--accent2); }
    .cfecha { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .card-maps { display: inline-flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); color: var(--accent); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .card-maps:active { opacity: 0.7; }

    /* STATES */
    .state-box { text-align: center; padding: 60px 20px; color: var(--muted); }
    .state-box .icon { font-size: 44px; margin-bottom: 14px; }
    .state-box h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .state-box p { font-size: 13px; line-height: 1.6; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODALS */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sheet { background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + var(--safe-bottom)); width: 100%; max-height: 90dvh; overflow-y: auto; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1); }
    .overlay.open .sheet { transform: translateY(0); }
    .handle { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .sheet-sub { font-size: 12px; font-family: var(--mono); color: var(--muted); margin-bottom: 12px; }
    .sec-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; margin-top: 18px; }
    .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .di { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px; }
    .di.full { grid-column: 1/-1; }
    .di-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .di-val { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-word; line-height: 1.4; }
    .di-val.ac { color: var(--accent); font-family: var(--mono); }
    .di-val.mo { color: var(--accent2); font-family: var(--mono); font-size: 16px; font-weight: 700; }
    .di-val.mu { color: var(--muted); font-size: 12px; }

    /* DATOS TRIBUNAL box */
    .trib-box { margin-top: 18px; background: linear-gradient(135deg, rgba(249,115,22,0.10), rgba(249,115,22,0.03)); border: 1.5px solid rgba(249,115,22,0.5); border-radius: 14px; padding: 14px; box-shadow: 0 0 14px rgba(249,115,22,0.15); }
    .trib-box-title { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; }
    .trib-box-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
    .trib-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .trib-item { background: rgba(11,18,32,0.5); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .trib-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .trib-val { font-size: 14px; font-weight: 700; color: var(--text); font-family: var(--mono); word-break: break-all; }
    .trib-val.cuenta { color: var(--accent2); font-size: 16px; }
    .trib-copy { width: 100%; margin-top: 10px; background: var(--accent); border: none; color: #0b1220; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer; }
    .trib-copy:active { opacity: 0.7; }
    .trib-copy.copied { background: #10b981; color: #fff; }

    /* ACTION BUTTONS in modal */
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .action-btn { flex: 1; min-width: 140px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer; text-decoration: none; }
    .action-btn:active { opacity: 0.75; }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }

    /* CONFIG modal */
    .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .cfg-row label { font-size: 12px; color: var(--muted); }
    .cfg-row input, .cfg-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-family: var(--mono); font-size: 12px; width: 70px; text-align: center; }
    .btn-save { width: 100%; background: var(--accent); border: none; color: #0b1220; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; margin-top: 14px; }
    .btn-close { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 10px; font-size: 13px; font-family: var(--font); cursor: pointer; margin-top: 8px; }

    .results-info { font-size: 11px; color: var(--muted); padding: 0 4px 10px; font-family: var(--mono); }
  </style>
</head>
<body>

<header id="appHeader">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">🔨</div>
      <div class="logo-text" style="font-size:18px">REMATES</div>
    </div>
    <div class="header-actions">

<div id="filterBars">

<!-- DETAIL MODAL -->

<!-- CONFIG MODAL -->
<div class="overlay" id="configOverlay">
  <div class="sheet">
    <div class="handle"></div>

    <div class="cfg-row"><label>Precio compra</label><input id="col_pcompra" /></div>

    <div class="cfg-row"><label>Superficie</label><input id="col_superficie" /></div>
    <div class="cfg-row"><label>Avalúo fiscal</label><input id="col_avaluo" /></div>
    <div class="cfg-row"><label>Deuda contribuciones</label><input id="col_contrib" /></div>
    <div class="cfg-row"><label>Forma consignación</label><input id="col_consig" /></div>
    <div class="cfg-row"><label>Observaciones</label><input id="col_obs" /></div>
    <div class="cfg-row"><label>Decisión</label><input id="col_decision" /></div>

<script>
const SHEET_ID = '1v4uEP4KTn7Iq7OvqRbrWtHr4BwgS-j3s';
const SHEET_DATOS_TRIB = 'DATOS TRIBUNALES Y REMATES';
const DEFAULT_CFG = {
  hasHeader:'1',
  col_fecha:'A', col_hora:'B', col_fechapub:'C', col_zoom:'D',
  col_inmueble:'E', col_ubicacion:'F', col_minimo:'G', col_docs:'H',
  col_demandante:'I', col_juicio:'J', col_tribunal:'K',
  col_pcompra:'L', col_acompra:'M', col_superficie:'N', col_avaluo:'O',
  col_contrib:'P', col_consig:'Q', col_obs:'R',
  col_decision:'S', col_madj:'T', col_resultado:'U', col_s3:'V'
};

let allRemates = [];
let datosTribunales = {}; // { "1 TEMUCO": { rut: "...", cuenta: "..." }, ... }
let selProx = false;
let selPasado = false;
let selProxRemate = false;
let selDecSi = false;
let selDecVer = false;
let selFecha = null;

let config = Object.assign({}, DEFAULT_CFG);
const savedCfg = localStorage.getItem('remates_cfg');
if (savedCfg) {
  try { config = Object.assign({}, DEFAULT_CFG, JSON.parse(savedCfg)); } catch(e){}
}

// ── Helpers ──
function ci(v) {
  if (!v) return -1;
  v = v.toString().trim();
  if (/^\d+$/.test(v)) return parseInt(v)-1;
  return v.toUpperCase().charCodeAt(0)-65;
}

// Excel serial date → JS Date
function excelSerialToDate(n) {
  const num = parseFloat(n);
  if (isNaN(num) || num < 10000) return null;
  const ms = (num - 25569) * 86400 * 1000;
  const d = new Date(ms);
  return isNaN(d.getTime()) ? null : d;
}

function parseFechaCell(v) {
  if (v === null || v === undefined) return null;
  // Si ya es Date
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  const s = String(v).trim();
  if (!s) return null;
  // Formato gviz: "Date(2026,3,15,11,0,0)" — meses 0-indexados
  const gvizMatch = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if (gvizMatch) {
    const y = parseInt(gvizMatch[1]);
    const m = parseInt(gvizMatch[2]);
    const d = parseInt(gvizMatch[3]);
    const h = gvizMatch[4] ? parseInt(gvizMatch[4]) : 0;
    const mi = gvizMatch[5] ? parseInt(gvizMatch[5]) : 0;
    const se = gvizMatch[6] ? parseInt(gvizMatch[6]) : 0;
    const dt = new Date(y, m, d, h, mi, se);
    return isNaN(dt.getTime()) ? null : dt;
  }
  // Excel serial
  if (/^\d+(\.\d+)?$/.test(s)) {
    const d = excelSerialToDate(s);
    if (d) return d;
  }
  // ISO o formato directo (último recurso)
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function formatFecha(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  return d.toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function formatFechaCorta(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  const dias = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
  return `${dias[d.getDay()]} ${d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})}`;
}

function formatFechaGrande(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  const dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}

function formatHora(v) {
  if (v === null || v === undefined || v === '') return '';
  const num = parseFloat(v);
  if (!isNaN(num) && num >= 0 && num < 1) {
    // fracción de día → hora
    const totalMin = Math.round(num * 24 * 60);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  return String(v).trim();
}

function formatMonto(m) {
  if (m === null || m === undefined || m === '') return '';
  const s = String(m).trim();
  if (!s) return '';
  // si tiene letras (ej "720 + 646.000"), devolver tal cual
  if (/[a-zA-Z]/.test(s) && !/^[0-9.eE+-]+$/.test(s)) return s;
  const n = parseFloat(s.replace(/[^0-9.eE+-]/g,''));
  if (isNaN(n)) return s;
  return '$' + Math.round(n).toLocaleString('es-CL');
}

function diasDesde(d) {
  if (!d) return null;
  const fecha = d instanceof Date ? d : parseFechaCell(d);
  if (!fecha) return null;
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  fecha.setHours(0,0,0,0);
  return Math.round((fecha - hoy) / (1000*60*60*24));
}

function isUrl(s) {
  return typeof s === 'string' && /^https?:\/\//i.test(s.trim());
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── LOAD ──
async function loadData() {
  showLoading();
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Error HTTP '+res.status);
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) throw new Error('Formato inesperado de la planilla');
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];
    const start = config.hasHeader === '1' ? 1 : 0;

    function gcv(row, col) {
      const idx = ci(col);
      if (idx < 0 || !row.c || idx >= row.c.length) return '';
      const cell = row.c[idx];
      if (!cell || cell.v === null || cell.v === undefined) return '';
      // valor formateado si existe, si no el crudo
      const v = (cell.f !== null && cell.f !== undefined && cell.f !== '') ? cell.f : cell.v;
      return String(v).trim();
    }

    function gcvRaw(row, col) {
      const idx = ci(col);
      if (idx < 0 || !row.c || idx >= row.c.length) return '';
      const cell = row.c[idx];
      if (!cell || cell.v === null || cell.v === undefined) return '';
      return cell.v;
    }

    allRemates = rows.slice(start).map((row, i) => ({
      id: i,
      fecha: gcvRaw(row, config.col_fecha),
      hora: gcvRaw(row, config.col_hora),
      fechaPub: gcvRaw(row, config.col_fechapub),
      zoom: gcv(row, config.col_zoom),
      inmueble: gcv(row, config.col_inmueble),
      ubicacion: gcv(row, config.col_ubicacion),
      minimo: gcv(row, config.col_minimo),
      docs: gcv(row, config.col_docs),
      demandante: gcv(row, config.col_demandante),
      juicio: gcv(row, config.col_juicio),
      tribunal: gcv(row, config.col_tribunal),
      pcompra: gcv(row, config.col_pcompra),
      acompra: gcv(row, config.col_acompra),
      superficie: gcv(row, config.col_superficie),
      avaluo: gcv(row, config.col_avaluo),
      contrib: gcv(row, config.col_contrib),
      consig: gcv(row, config.col_consig),
      obs: gcv(row, config.col_obs),
      decision: gcv(row, config.col_decision),
      madj: gcv(row, config.col_madj),
      resultado: gcv(row, config.col_resultado),
      s3: gcv(row, config.col_s3),
    })).filter(r => r.inmueble || r.juicio);

    // Pre-calcular fecha como Date
    allRemates.forEach(r => { r._fecha = parseFechaCell(r.fecha); });

    // Cargar datos de tribunales en paralelo (no bloquea si falla)
    loadDatosTribunales().catch(()=>{});

    // Reset filtros
    selProx = false; selPasado = false; selProxRemate = false;
    selDecSi = false; selDecVer = false; selFecha = null;

    buildEstadoBar();
    buildFechasFuturasBar();
    applyFilters();
  } catch (e) {
    showError(e.message);
  }
}

// ── LOAD DATOS TRIBUNALES ──
async function loadDatosTribunales() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_DATOS_TRIB)}`;
    const res = await fetch(url);
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) return;
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];

    const dict = {};
    rows.forEach(row => {
      if (!row.c) return;
      // B = índice 1 (tribunal), C = índice 2 (rut), D = índice 3 (cuenta)
      const cellTrib = row.c[1];
      const cellRut = row.c[2];
      const cellCta = row.c[3];
      const trib = cellTrib && cellTrib.v != null ? String(cellTrib.f || cellTrib.v).trim() : '';
      const rut = cellRut && cellRut.v != null ? String(cellRut.f || cellRut.v).trim() : '';
      const cta = cellCta && cellCta.v != null ? String(cellCta.f || cellCta.v).trim() : '';
      // Saltar encabezados o vacíos
      if (!trib || trib.toUpperCase() === 'TRIBUNAL') return;
      dict[trib.toUpperCase()] = { rut, cuenta: cta };
    });
    datosTribunales = dict;
  } catch(e) {
    // Silencioso: si falla, simplemente no se mostrará la caja
  }
}

// ── ESTADO BAR (chips de filtro principal) ──
function buildEstadoBar() {
  const bar = document.getElementById('estadoBar');
  bar.innerHTML = '';

  const proxCount = allRemates.filter(r => {
    const d = diasDesde(r._fecha);
    return d !== null && d >= 0;
  }).length;

  const pasadoCount = allRemates.filter(r => {
    const d = diasDesde(r._fecha);
    return d !== null && d < 0;
  }).length;

  const decSiCount = allRemates.filter(r => (r.decision||'').toUpperCase().trim() === 'SI').length;
  const decVerCount = allRemates.filter(r => {
    const d = (r.decision||'').toUpperCase().trim();
    return d === 'VER' || d.includes('VER');
  }).length;

  // Calcular fecha del próximo remate (la más cercana en el futuro, incluyendo hoy)
  let proxRemateKey = null;
  let proxRemateDias = null;
  let proxRemateCount = 0;
  allRemates.forEach(r => {
    const d = diasDesde(r._fecha);
    if (d === null || d < 0) return;
    if (proxRemateDias === null || d < proxRemateDias) {
      proxRemateDias = d;
      const dt = r._fecha;
      proxRemateKey = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    }
  });
  if (proxRemateKey) {
    proxRemateCount = allRemates.filter(r => {
      if (!r._fecha) return false;
      const dt = r._fecha;
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      return key === proxRemateKey;
    }).length;
  }

  // PRÓX. REMATE (siempre primero, destacado)
  if (proxRemateCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-proxremate';
    chip.dataset.key = 'proxremate';
    let etiqueta = 'PRÓX. REMATE';
    if (proxRemateDias === 0) etiqueta = '🔥 HOY';
    else if (proxRemateDias === 1) etiqueta = '⚡ MAÑANA';
    else if (proxRemateDias <= 7) etiqueta = `⚡ EN ${proxRemateDias}D`;
    chip.innerHTML = `<span class="dot"></span>${etiqueta} <span class="n">${proxRemateCount}</span>`;
    chip.addEventListener('click', () => {
      selProxRemate = !selProxRemate;
      chip.classList.toggle('active', selProxRemate);
      // Guardamos la key para usarla al filtrar
      chip.dataset.fechaKey = proxRemateKey;
      applyFilters();
    });
    chip.dataset.fechaKey = proxRemateKey;
    bar.appendChild(chip);
  }

  // PRÓXIMOS
  if (proxCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-prox';
    chip.dataset.key = 'prox';
    chip.innerHTML = `<span class="dot"></span>PRÓXIMOS <span class="n">${proxCount}</span>`;
    chip.addEventListener('click', () => {
      selProx = !selProx;
      if (selProx) selPasado = false;
      chip.classList.toggle('active', selProx);
      const pasadoChip = document.querySelector('.chip[data-key="pasado"]');
      if (pasadoChip) pasadoChip.classList.remove('active');
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // PASADOS
  if (pasadoCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-pasado';
    chip.dataset.key = 'pasado';
    chip.innerHTML = `<span class="dot"></span>PASADOS <span class="n">${pasadoCount}</span>`;
    chip.addEventListener('click', () => {
      selPasado = !selPasado;
      if (selPasado) selProx = false;
      chip.classList.toggle('active', selPasado);
      const proxChip = document.querySelector('.chip[data-key="prox"]');
      if (proxChip) proxChip.classList.remove('active');
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // DECISIÓN SI
  if (decSiCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-decsi';
    chip.dataset.key = 'decsi';
    chip.innerHTML = `<span class="dot"></span>DECISIÓN SI <span class="n">${decSiCount}</span>`;
    chip.addEventListener('click', () => {
      selDecSi = !selDecSi;
      chip.classList.toggle('active', selDecSi);
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // DECISIÓN VER
  if (decVerCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-decver';
    chip.dataset.key = 'decver';
    chip.innerHTML = `<span class="dot"></span>POR REVISAR <span class="n">${decVerCount}</span>`;
    chip.addEventListener('click', () => {
      selDecVer = !selDecVer;
      chip.classList.toggle('active', selDecVer);
      applyFilters();
    });
    bar.appendChild(chip);
  }
}

// ── FECHAS FUTURAS BAR ──
function buildFechasFuturasBar() {
  const bar = document.getElementById('abogadoBar');
  bar.innerHTML = '';

  // Agrupar remates futuros (incluye HOY) por fecha
  const grupos = {};
  allRemates.forEach(r => {
    const dias = diasDesde(r._fecha);
    if (dias === null || dias < 0) return;
    // clave = timestamp de día
    const d = r._fecha;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!grupos[key]) grupos[key] = { fecha: d, count: 0, dias };
    grupos[key].count++;
  });

  // Ordenar por fecha ascendente
  const ordenadas = Object.entries(grupos).sort((a,b) => a[0].localeCompare(b[0]));

  if (ordenadas.length === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = '';

  // Btn "Todas"
  const allBtn = document.createElement('button');
  allBtn.className = 'abog-btn active';
  allBtn.dataset.key = 'all';
  const totalFut = ordenadas.reduce((s,[,g]) => s + g.count, 0);
  allBtn.innerHTML = `Todas las fechas <span class="n">${totalFut}</span>`;
  allBtn.addEventListener('click', () => { selFecha = null; syncFechaBtns(); applyFilters(); });
  bar.appendChild(allBtn);

  ordenadas.forEach(([key, g]) => {
    const btn = document.createElement('button');
    btn.className = 'abog-btn';
    btn.dataset.fecha = key;
    const dias = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
    const fechaTxt = `${dias[g.fecha.getDay()]} ${g.fecha.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})}`;
    let prefix = '';
    if (g.dias === 0) prefix = '🔥 HOY · ';
    else if (g.dias === 1) prefix = 'MAÑANA · ';
    btn.innerHTML = `${prefix}${fechaTxt} <span class="n">${g.count}</span>`;
    btn.addEventListener('click', () => {
      selFecha = selFecha === key ? null : key;
      syncFechaBtns();
      applyFilters();
    });
    bar.appendChild(btn);
  });
}

function syncFechaBtns() {
  document.querySelectorAll('#abogadoBar .abog-btn').forEach(btn => {
    const isAll = btn.dataset.key === 'all';
    btn.classList.toggle('active', isAll ? !selFecha : btn.dataset.fecha === selFecha);
  });
}

// ── FILTROS ──
function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  const filtered = allRemates.filter(r => {
    const txt = [r.inmueble, r.demandante, r.juicio, r.tribunal, r.obs, r.consig, r.resultado].join(' ').toLowerCase();
    if (q && !txt.includes(q)) return false;

    if (selProxRemate) {
      const chip = document.querySelector('.chip[data-key="proxremate"]');
      const proxKey = chip ? chip.dataset.fechaKey : null;
      if (!proxKey || !r._fecha) return false;
      const dt = r._fecha;
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if (key !== proxKey) return false;
    }
    if (selProx) {
      const d = diasDesde(r._fecha);
      if (d === null || d < 0) return false;
    }
    if (selPasado) {
      const d = diasDesde(r._fecha);
      if (d === null || d >= 0) return false;
    }
    if (selDecSi && (r.decision||'').toUpperCase().trim() !== 'SI') return false;
    if (selDecVer) {
      const dec = (r.decision||'').toUpperCase().trim();
      if (!(dec === 'VER' || dec.includes('VER'))) return false;
    }
    if (selFecha) {
      if (!r._fecha) return false;
      const d = r._fecha;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (key !== selFecha) return false;
    }

    return true;
  });

  // Ordenar: fechas más futuras arriba, descendiendo hasta las más antiguas abajo. Sin fecha al final.
  filtered.sort((a, b) => {
    const tA = a._fecha ? a._fecha.getTime() : null;
    const tB = b._fecha ? b._fecha.getTime() : null;
    if (tA === null && tB === null) return 0;
    if (tA === null) return 1;
    if (tB === null) return -1;
    return tB - tA;
  });

  renderCards(filtered);
}

function renderCards(list) {
  const main = document.getElementById('mainContent');
  const info = document.getElementById('resultsInfo');
  info.textContent = `${list.length} remate${list.length===1?'':'s'}`;

  if (list.length === 0) {
    main.innerHTML = `<div class="state-box"><div class="icon">🔍</div><h3>Sin resultados</h3><p>Ajusta los filtros o la búsqueda</p></div>`;
    return;
  }

  main.innerHTML = list.map(r => {
    const dias = diasDesde(r._fecha);
    let badgeHtml = '';
    let stripeColor = 'var(--muted)';
    if (dias !== null) {
      if (dias === 0) {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#ef4444">HOY</span>`;
        stripeColor = '#ef4444';
      } else if (dias > 0 && dias <= 7) {
        badgeHtml = `<span class="sbadge" style="color:#0b1220;background:#fbbf24">EN ${dias}D</span>`;
        stripeColor = '#fbbf24';
      } else if (dias > 7) {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#10b981">${dias}D</span>`;
        stripeColor = '#10b981';
      } else {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#64748b">PASÓ</span>`;
        stripeColor = '#64748b';
      }
    }

    const dec = (r.decision||'').toUpperCase().trim();
    const cardClass = dec === 'SI' ? 'card dec-si' : (dec === 'NO' ? 'card dec-no' : 'card');

    const tags = [];
    if ((r.zoom||'').toUpperCase().trim() === 'SI') tags.push('<span class="tag zoom">📹 ZOOM</span>');
    if (dec === 'SI') tags.push('<span class="tag dec-si">✓ DECISIÓN SI</span>');
    else if (dec === 'NO') tags.push('<span class="tag">✗ NO</span>');
    else if (dec.includes('VER')) tags.push('<span class="tag dec-ver">⚠ POR VER</span>');

    const fechaGrande = r._fecha ? formatFechaGrande(r._fecha) : '(sin fecha)';
    const horaTxt = formatHora(r.hora);

    const mapsBtn = isUrl(r.ubicacion)
      ? `<a class="card-maps" href="${escapeHtml(r.ubicacion)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Mapa</a>`
      : '';

    return `
      <div class="${cardClass}" style="--sc:${stripeColor}" data-id="${r.id}" onclick="openDetail(${r.id})">
        <div class="card-top">
          <div class="card-fecha-big">${fechaGrande}${horaTxt ? ` <span class="card-hora">${horaTxt}</span>` : ''}</div>
          ${badgeHtml}
        </div>
        <div class="card-name">${escapeHtml(r.inmueble || '(sin inmueble)')}</div>
        <div class="card-sub">${escapeHtml(r.juicio||'')}${r.tribunal?' · '+escapeHtml(r.tribunal):''}</div>
        ${tags.length ? `<div class="card-tags">${tags.join('')}</div>` : ''}
        <div class="card-foot">
          <span class="cmonto">${formatMonto(r.minimo)}</span>
          ${mapsBtn}
        </div>
      </div>
    `;
  }).join('');
}

// ── DETAIL MODAL ──

  if (isUrl(r.ubicacion)) {
    actions += `<a class="action-btn primary" href="${escapeHtml(r.ubicacion)}" target="_blank" rel="noopener">📍 Ver mapa</a>`;

      ${fila('Año compra', r.acompra)}
      ${fila('Superficie', r.superficie)}
      ${fila('Avalúo fiscal', formatMonto(r.avaluo))}
      ${fila('Deuda contrib.', r.contrib)}
    </div>

    <div class="sec-label">Causa</div>

        <div class="trib-box">

          <div class="trib-box-name">${escapeHtml(r.tribunal)}</div>
          <div class="trib-box-grid">
            ${dt.rut ? `<div class="trib-item"><div class="trib-label">RUT</div><div class="trib-val">${escapeHtml(dt.rut)}</div></div>` : ''}
            ${dt.cuenta ? `<div class="trib-item"><div class="trib-label">Cuenta corriente</div><div class="trib-val cuenta">${escapeHtml(dt.cuenta)}</div></div>` : ''}
          </div>
          ${dt.cuenta ? `<button class="trib-copy" onclick="copyText('${escapeHtml(dt.cuenta).replace(/'/g, "\\'")}', this)">📋 Copiar cuenta</button>` : ''}
        </div>
      `;
    })()}

    <div class="sec-label">Resultado</div>
    <div class="dgrid">
      ${fila('Decisión', r.decision)}

      ${fila('S3', r.s3)}

}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

function copyText(txt, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      }
    }).catch(() => fallbackCopy(txt, btn));
  } else {
    fallbackCopy(txt, btn);
  }
}

function fallbackCopy(txt, btn) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    }
  } catch(e) {}
  document.body.removeChild(ta);
}

document.getElementById('btnCloseDetail').addEventListener('click', () => closeOverlay('detailOverlay'));
document.getElementById('detailOverlay').addEventListener('click', e => { if (e.target.id === 'detailOverlay') closeOverlay('detailOverlay'); });

document.getElementById('btnReload').addEventListener('click', loadData);

document.getElementById('btnConfig').addEventListener('click', () => {
  document.getElementById('hasHeader').value = config.hasHeader || '1';
  Object.keys(DEFAULT_CFG).filter(k => k.startsWith('col_')).forEach(k => {
    const el = document.getElementById(k);
    if (el) el.value = config[k] || DEFAULT_CFG[k];
  });
  document.getElementById('configOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
});

document.getElementById('btnCloseConfig').addEventListener('click', () => closeOverlay('configOverlay'));

document.getElementById('btnSaveConfig').addEventListener('click', () => {
  const newCfg = { hasHeader: document.getElementById('hasHeader').value };
  Object.keys(DEFAULT_CFG).filter(k => k.startsWith('col_')).forEach(k => {
    const el = document.getElementById(k);
    newCfg[k] = (el && el.value) ? el.value : DEFAULT_CFG[k];
  });
  config = newCfg;
  localStorage.setItem('remates_cfg', JSON.stringify(config));
  closeOverlay('configOverlay');
  loadData();
});

document.getElementById('searchInput').addEventListener('input', applyFilters);

function showLoading() {
  document.getElementById('mainContent').innerHTML = `<div class="state-box"><div class="spinner"></div><h3>Cargando remates…</h3><p>Conectando con Google Sheets</p></div>`;
  document.getElementById('resultsInfo').textContent = '';
}

function showError(msg) {
  document.getElementById('mainContent').innerHTML = `<div class="state-box"><div class="icon">⚠️</div><h3>Error al cargar</h3><p>${escapeHtml(msg)}</p><p style="margin-top:14px;font-size:11px">Verifica que la planilla esté compartida con "Cualquiera con el enlace puede ver"</p></div>`;
  document.getElementById('resultsInfo').textContent = '';
}

// Service worker registration con auto-update
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      // Buscar updates inmediatamente y luego cada 60 segundos
      reg.update().catch(()=>{});
      setInterval(() => reg.update().catch(()=>{}), 60000);

      // Cuando se detecta un service worker nuevo en espera, activarlo
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if (!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
            // Hay una versión nueva instalada y un SW activo: forzar takeover
            nuevo.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(()=>{});

    // Cuando el SW cambia de control (después de skipWaiting), recargar la página
    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargando) return;
      recargando = true;
      window.location.reload();
    });
  });
}

loadData();
