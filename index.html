<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Remates" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Remates</title>
  <style>
    :root {
      --bg: #0b1220; --surface: #111c2d; --surface2: #172236; --border: #1e3050;
      --accent: #f97316; --accent2: #fbbf24; --text: #e2eaf5; --muted: #64748b;
      --font: Calibri, 'Calibri', 'Gill Sans', sans-serif;
      --mono: 'Courier New', Courier, monospace;
      --radius: 12px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* HEADER */
    #appHeader {
      padding: calc(14px + var(--safe-top)) 18px 14px;
      background: #0b1220;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #ea580c); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .logo-text span { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 15px; cursor: pointer; font-family: var(--font); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 14px; }
    #searchInput { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 11px 11px 36px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; }
    #searchInput:focus { border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    /* FILTER BARS */
    #filterBars { background: #0b1220; border-bottom: 1px solid var(--border); z-index: 99; }
    .bar-row { display: flex; gap: 10px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .bar-row::-webkit-scrollbar { display: none; }

    /* CHIPS (multi select) */
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .chip .n { font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.2); padding: 1px 7px; border-radius: 100px; min-width: 24px; text-align: center; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #0b1220; }

    .chip.c-prox { color: #10b981; border-color: rgba(16,185,129,0.4); }
    .chip.c-prox.active { background: #10b981; border-color: #10b981; color: #fff; }
    .chip.c-proxremate { color: #fff; background: linear-gradient(135deg, #f97316, #ea580c); border-color: #f97316; box-shadow: 0 0 12px rgba(249,115,22,0.4); }
    .chip.c-proxremate.active { background: #fbbf24; border-color: #fbbf24; color: #0b1220; box-shadow: 0 0 18px rgba(251,191,36,0.6); }
    .chip.c-pasado { color: #64748b; border-color: rgba(100,116,139,0.4); }
    .chip.c-pasado.active { background: #64748b; border-color: #64748b; color: #fff; }
    .chip.c-zoom { color: #3b82f6; border-color: rgba(59,130,246,0.4); }
    .chip.c-zoom.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .chip.c-decsi { color: #10b981; border-color: rgba(16,185,129,0.4); }
    .chip.c-decsi.active { background: #10b981; border-color: #10b981; color: #fff; }
    .chip.c-decver { color: #fbbf24; border-color: rgba(251,191,36,0.4); }
    .chip.c-decver.active { background: #fbbf24; border-color: #fbbf24; color: #0b1220; }
    .chip.c-adjs3 { color: #a78bfa; border-color: rgba(167,139,250,0.4); }
    .chip.c-adjs3.active { background: #a78bfa; border-color: #a78bfa; color: #0b1220; }

    /* DEMANDANTE BTNS (con contador dinámico) */
    .abog-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.15s;
    }
    .abog-btn .n { font-size: 10px; font-weight: 800; background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 100px; min-width: 20px; text-align: center; transition: all 0.15s; }
    .abog-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(249,115,22,0.07); }
    .abog-btn.active .n { background: rgba(249,115,22,0.2); }

    /* MAIN */
    main { flex: 1; padding: 14px 14px calc(16px + var(--safe-bottom)); overflow-y: auto; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; cursor: pointer; position: relative; overflow: hidden; transition: opacity 0.15s, box-shadow 0.2s, border-color 0.2s; }
    .card.dec-si { border-color: #10b981; box-shadow: 0 0 0 1px #10b981, 0 0 16px rgba(16,185,129,0.45); }
    .card.dec-no { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444, 0 0 16px rgba(239,68,68,0.45); }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sc, var(--muted)); }
    .card:active { opacity: 0.75; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .card-fecha-big { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: 0.3px; line-height: 1.2; flex: 1; text-transform: uppercase; }
    .card-hora { font-size: 13px; font-weight: 700; color: var(--text); font-family: var(--mono); margin-left: 4px; }
    .card-name { font-size: 14px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
    .sbadge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-sub { font-size: 11px; font-family: var(--mono); color: var(--muted); margin-bottom: 9px; line-height: 1.5; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .tag.hl { color: var(--accent); border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.07); }
    .tag.zoom { color: #3b82f6; border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.07); }
    .tag.dec-si { color: #10b981; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.07); }
    .tag.dec-ver { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.07); }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .cg-item { display: flex; flex-direction: column; gap: 1px; }
    .cg-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .cg-val { font-size: 12px; color: var(--text); font-family: var(--mono); }
    .card-foot { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Cajas destacadas en el modal: Instrucción Adjudicación y Resultado */
    .modal-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .modal-box { border-radius: 12px; padding: 14px; border: 1.5px solid; min-height: 90px; display: flex; flex-direction: column; }
    .modal-box-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; line-height: 1.2; }
    .modal-box-val { font-size: 15px; font-weight: 700; font-family: var(--mono); line-height: 1.3; word-break: break-word; flex: 1; display: flex; align-items: center; }
    .modal-box-empty { font-size: 13px; font-style: italic; color: var(--muted); flex: 1; display: flex; align-items: center; opacity: 0.7; }
    .modal-box-instr { border-color: rgba(167,139,250,0.5); background: rgba(167,139,250,0.08); }
    .modal-box-instr .modal-box-label { color: #a78bfa; }
    .modal-box-instr .modal-box-val { color: #c4b5fd; }
    .modal-box-result { border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.08); }
    .modal-box-result .modal-box-label { color: #fbbf24; }
    .modal-box-result .modal-box-val { color: #fde68a; }
    .modal-box.is-empty { background: rgba(100,116,139,0.05); border-color: rgba(100,116,139,0.25); border-style: dashed; }
    .modal-box.is-empty .modal-box-label { color: var(--muted); opacity: 0.7; }
    @media (max-width: 480px) {
      .modal-boxes { grid-template-columns: 1fr; }
    }
    .cmonto { font-size: 14px; font-weight: 700; font-family: var(--mono); color: var(--accent2); }
    .cfecha { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .card-maps { display: inline-flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); color: var(--accent); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .card-maps:active { opacity: 0.7; }

    /* STATES */
    .state-box { text-align: center; padding: 60px 20px; color: var(--muted); }
    .state-box .icon { font-size: 44px; margin-bottom: 14px; }
    .state-box h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .state-box p { font-size: 13px; line-height: 1.6; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODALS */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sheet { background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + var(--safe-bottom)); width: 100%; max-height: 90dvh; overflow-y: auto; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1); }
    .overlay.open .sheet { transform: translateY(0); }
    .handle { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .sheet-sub { font-size: 12px; font-family: var(--mono); color: var(--muted); margin-bottom: 12px; }
    .sec-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; margin-top: 18px; }
    .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .di { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px; }
    .di.full { grid-column: 1/-1; }
    .di-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .di-val { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-word; line-height: 1.4; }
    .di-val.ac { color: var(--accent); font-family: var(--mono); }
    .di-val.mo { color: var(--accent2); font-family: var(--mono); font-size: 16px; font-weight: 700; }
    .di-val.mu { color: var(--muted); font-size: 12px; }

    /* DATOS TRIBUNAL box */
    .trib-box { margin-top: 18px; background: linear-gradient(135deg, rgba(249,115,22,0.10), rgba(249,115,22,0.03)); border: 1.5px solid rgba(249,115,22,0.5); border-radius: 14px; padding: 14px; box-shadow: 0 0 14px rgba(249,115,22,0.15); }
    .trib-box-title { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; }
    .trib-box-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
    .trib-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .trib-item { background: rgba(11,18,32,0.5); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .trib-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .trib-val { font-size: 14px; font-weight: 700; color: var(--text); font-family: var(--mono); word-break: break-all; }
    .trib-val.cuenta { color: var(--accent2); font-size: 16px; }
    .trib-copy { width: 100%; margin-top: 10px; background: var(--accent); border: none; color: #0b1220; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer; }
    .trib-copy:active { opacity: 0.7; }
    .trib-copy.copied { background: #10b981; color: #fff; }
    .trib-box.trib-box-empty { background: rgba(100,116,139,0.05); border-color: rgba(100,116,139,0.3); border-style: dashed; box-shadow: none; }
    .trib-box.trib-box-empty .trib-box-title { color: var(--muted); }
    .trib-empty-msg { font-size: 12px; font-style: italic; color: var(--muted); padding: 8px 0 0; line-height: 1.4; }

    /* ACTION BUTTONS in modal */
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .action-btn { flex: 1; min-width: 140px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer; text-decoration: none; }
    .action-btn:active { opacity: 0.75; }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }

    /* CONFIG modal */
    .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .cfg-row label { font-size: 12px; color: var(--muted); }
    .cfg-row input, .cfg-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-family: var(--mono); font-size: 12px; width: 70px; text-align: center; }
    .btn-save { width: 100%; background: var(--accent); border: none; color: #0b1220; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; margin-top: 14px; }
    .btn-close { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 10px; font-size: 13px; font-family: var(--font); cursor: pointer; margin-top: 8px; }

    .results-info { font-size: 11px; color: var(--muted); padding: 0 4px 10px; font-family: var(--mono); }
  </style>
</head>
<body>

<header id="appHeader">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">🔨</div>
      <div class="logo-text" style="font-size:18px">REMATES</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btnGastos" title="Módulo Gastos">💰</button>
      <button class="btn-icon" id="btnReload" title="Recargar">↻</button>
      <button class="btn-icon" id="btnConfig" title="Configurar">⚙</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="search" placeholder="Buscar inmueble, rol, tribunal, demandante..." autocomplete="off" />
  </div>
</header>

<div id="filterBars">
  <div class="bar-row" id="estadoBar"></div>
  <div class="bar-row" id="abogadoBar"></div>
</div>

<main>
  <div id="resultsInfo" class="results-info"></div>
  <div id="mainContent"></div>
</main>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="handle"></div>
    <div id="detailContent"></div>
    <button class="btn-close" id="btnCloseDetail" style="margin-top:18px">Cerrar</button>
  </div>
</div>

<!-- CONFIG MODAL -->
<div class="overlay" id="configOverlay">
  <div class="sheet">
    <div class="handle"></div>
    <h2 class="sheet-title">Configurar columnas</h2>
    <p class="sheet-sub">Ajusta a qué columna corresponde cada dato</p>
    <div class="cfg-row"><label>Fila encabezado</label><select id="hasHeader"><option value="1">Sí</option><option value="0">No</option></select></div>
    <div class="cfg-row"><label>Fecha remate</label><input id="col_fecha" /></div>
    <div class="cfg-row"><label>Hora</label><input id="col_hora" /></div>
    <div class="cfg-row"><label>Fecha publicación</label><input id="col_fechapub" /></div>
    <div class="cfg-row"><label>Zoom (SI/NO)</label><input id="col_zoom" /></div>
    <div class="cfg-row"><label>Inmueble</label><input id="col_inmueble" /></div>
    <div class="cfg-row"><label>Ubicación (link)</label><input id="col_ubicacion" /></div>
    <div class="cfg-row"><label>Mínimo</label><input id="col_minimo" /></div>
    <div class="cfg-row"><label>Documentos (link)</label><input id="col_docs" /></div>
    <div class="cfg-row"><label>Demandante</label><input id="col_demandante" /></div>
    <div class="cfg-row"><label>Juicio (rol)</label><input id="col_juicio" /></div>
    <div class="cfg-row"><label>Tribunal</label><input id="col_tribunal" /></div>
    <div class="cfg-row"><label>Precio compra</label><input id="col_pcompra" /></div>
    <div class="cfg-row"><label>Año compra</label><input id="col_acompra" /></div>
    <div class="cfg-row"><label>Superficie</label><input id="col_superficie" /></div>
    <div class="cfg-row"><label>Avalúo fiscal</label><input id="col_avaluo" /></div>
    <div class="cfg-row"><label>Deuda contribuciones</label><input id="col_contrib" /></div>
    <div class="cfg-row"><label>Forma consignación</label><input id="col_consig" /></div>
    <div class="cfg-row"><label>Observaciones</label><input id="col_obs" /></div>
    <div class="cfg-row"><label>Decisión</label><input id="col_decision" /></div>
    <div class="cfg-row"><label>Monto adjudicación</label><input id="col_madj" /></div>
    <div class="cfg-row"><label>Resultado</label><input id="col_resultado" /></div>
    <div class="cfg-row"><label>S3</label><input id="col_s3" /></div>
    <button class="btn-save" id="btnSaveConfig">Guardar</button>
    <button class="btn-close" id="btnCloseConfig">Cancelar</button>
  </div>
</div>

<!-- GASTOS MODAL -->
<div class="overlay" id="gastosOverlay">
  <div class="sheet" style="max-width:900px">
    <div class="handle"></div>
    <h2 class="sheet-title" style="text-align:center;letter-spacing:1px">MÓDULO GASTOS</h2>

    <!-- Saldos + gráfico -->
    <div id="gastosSaldos" style="margin:12px 0"></div>

    <!-- Gráfico de torta -->
    <div style="display:flex;justify-content:center;margin:20px 0">
      <svg id="gastosPie" width="240" height="240" viewBox="0 0 240 240"></svg>
    </div>

    <!-- Chips de aportantes -->
    <div class="bar-row" id="gastosChips" style="margin:14px 0"></div>

    <!-- Detalle de gastos -->
    <div id="gastosDetalle" style="margin-top:14px"></div>

    <button class="btn-close" id="btnCloseGastos">Cerrar</button>
  </div>
</div>

<!-- LOGIN OVERLAY -->
<div class="overlay" id="loginOverlay" style="background:rgba(0,0,0,0.95)">
  <div class="sheet" style="max-width:400px;text-align:center;padding:40px 24px">
    <div style="font-size:48px;margin-bottom:12px">🔒</div>
    <h2 class="sheet-title" style="text-align:center">Acceso restringido</h2>
    <p class="sheet-sub" style="text-align:center">Ingresa la clave para continuar</p>
    <input id="loginInput" type="password" placeholder="Clave"

// ─────────────────────────────────────────────
// LIMPIEZA AGRESIVA DE SERVICE WORKER VIEJO
// Desde el inicio: si encontramos un SW activo, lo matamos, borramos todo
// el caché, y recargamos la página SIN caché. Esto rompe el ciclo del SW viejo.
// ─────────────────────────────────────────────
(function killOldServiceWorker(){
  if (!('serviceWorker' in navigator)) return;
  // Si hay un controller activo, significa que un SW está interceptando
  const hayControlador = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.getRegistrations().then((regs) => {
    if (regs.length === 0 && !hayControlador) return;
    Promise.all(regs.map(r => r.unregister().catch(()=>{}))).then(() => {
      if (window.caches && caches.keys) {
        return caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k).catch(()=>{}))));
      }
    }).then(() => {
      if (hayControlador && !sessionStorage.getItem('sw_killed_reload')) {
        sessionStorage.setItem('sw_killed_reload', '1');
        // Forzar reload sin caché
        window.location.reload();
      }
    }).catch(()=>{});
  }).catch(()=>{});
})();

// ── Helpers ──
function ci(v) {
  if (!v) return -1;
  v = v.toString().trim();
  if (/^\d+$/.test(v)) return parseInt(v)-1;
  return v.toUpperCase().charCodeAt(0)-65;
}

// Excel serial date → JS Date
function excelSerialToDate(n) {
  const num = parseFloat(n);
  if (isNaN(num) || num < 10000) return null;
  const ms = (num - 25569) * 86400 * 1000;
  const d = new Date(ms);
  return isNaN(d.getTime()) ? null : d;
}

function parseFechaCell(v) {
  if (v === null || v === undefined) return null;
  // Si ya es Date
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  const s = String(v).trim();
  if (!s) return null;
  // Formato gviz: "Date(2026,3,15,11,0,0)" — meses 0-indexados
  const gvizMatch = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if (gvizMatch) {
    const y = parseInt(gvizMatch[1]);
    const m = parseInt(gvizMatch[2]);
    const d = parseInt(gvizMatch[3]);
    const h = gvizMatch[4] ? parseInt(gvizMatch[4]) : 0;
    const mi = gvizMatch[5] ? parseInt(gvizMatch[5]) : 0;
    const se = gvizMatch[6] ? parseInt(gvizMatch[6]) : 0;
    const dt = new Date(y, m, d, h, mi, se);
    return isNaN(dt.getTime()) ? null : dt;
  }
  // Excel serial
  if (/^\d+(\.\d+)?$/.test(s)) {
    const d = excelSerialToDate(s);
    if (d) return d;
  }
  // ISO o formato directo (último recurso)
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function formatFecha(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  return d.toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function formatFechaCorta(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  const dias = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
  return `${dias[d.getDay()]} ${d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})}`;
}

function formatFechaGrande(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : parseFechaCell(v);
  if (!d) return '';
  const dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}

function formatHora(v) {
  if (v === null || v === undefined || v === '') return '';
  const s = String(v).trim();
  if (!s) return '';
  // Formato gviz datetime: "Date(2026,3,15,11,0,0)" — tomamos solo HH:MM
  const gvizMatch = s.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)(?:,\d+)?\)$/);
  if (gvizMatch) {
    const h = parseInt(gvizMatch[1]);
    const m = parseInt(gvizMatch[2]);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  // Formato gviz time-only: "[11,0,0]" — raro, por seguridad
  const timeMatch = s.match(/^\[(\d+),(\d+),(\d+)\]$/);
  if (timeMatch) {
    const h = parseInt(timeMatch[1]);
    const m = parseInt(timeMatch[2]);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  // Si es un número entre 0 y 1, es fracción de día
  const num = parseFloat(s);
  if (!isNaN(num) && num >= 0 && num < 1) {
    const totalMin = Math.round(num * 24 * 60);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  // Si parece "11:00" o "11:00:00"  ya formateado, devolverlo limpio
  if (/^\d{1,2}:\d{2}/.test(s)) return s.substring(0, 5);
  // Último recurso: si tiene "Date(", no mostrar el crudo
  if (s.startsWith('Date(')) return '';
  return s;
}

function formatMonto(m) {
  if (m === null || m === undefined || m === '') return '';
  const s = String(m).trim();
  if (!s) return '';
  // si tiene letras (ej "720 + 646.000"), devolver tal cual
  if (/[a-zA-Z]/.test(s) && !/^[0-9.eE+-]+$/.test(s)) return s;
  const n = parseFloat(s.replace(/[^0-9.eE+-]/g,''));
  if (isNaN(n)) return s;
  return '$' + Math.round(n).toLocaleString('es-CL');
}

function diasDesde(d) {
  if (!d) return null;
  const fecha = d instanceof Date ? d : parseFechaCell(d);
  if (!fecha) return null;
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  fecha.setHours(0,0,0,0);
  return Math.round((fecha - hoy) / (1000*60*60*24));
}

function isUrl(s) {
  return typeof s === 'string' && /^https?:\/\//i.test(s.trim());
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── LOAD ──
async function loadData() {
  showLoading();
  try {
    // Forzamos el rango A:V para garantizar que SIEMPRE vengan todas las columnas
    // hasta S3 (V), incluso si Google decide recortar el rango automáticamente.
    const ts = Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&range=A1:V500&_t=${ts}`;
    const res = await fetch(url, {
      cache: 'no-store',
      mode: 'cors',
      credentials: 'omit',
      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
    });
    if (!res.ok) throw new Error('Error HTTP '+res.status);
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) throw new Error('Formato inesperado de la planilla');
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];
    // Google gviz ya separa el encabezado automáticamente (lo pone en json.table.cols),
    // así que NO debemos hacer slice extra. Si hicimos slice(1), nos saltamos la
    // primera fila de datos por error.
    const start = 0;

    function gcv(row, col) {
      const idx = ci(col);
      if (idx < 0 || !row.c || idx >= row.c.length) return '';
      const cell = row.c[idx];
      if (!cell || cell.v === null || cell.v === undefined) return '';
      // valor formateado si existe, si no el crudo
      const v = (cell.f !== null && cell.f !== undefined && cell.f !== '') ? cell.f : cell.v;
      return String(v).trim();
    }

    function gcvRaw(row, col) {
      const idx = ci(col);
      if (idx < 0 || !row.c || idx >= row.c.length) return '';
      const cell = row.c[idx];
      if (!cell || cell.v === null || cell.v === undefined) return '';
      return cell.v;
    }

    allRemates = rows.slice(start).map((row, i) => ({
      id: i,
      fecha: gcvRaw(row, config.col_fecha),
      hora: gcv(row, config.col_hora),
      fechaPub: gcvRaw(row, config.col_fechapub),
      zoom: gcv(row, config.col_zoom),
      inmueble: gcv(row, config.col_inmueble),
      ubicacion: gcv(row, config.col_ubicacion),
      minimo: gcv(row, config.col_minimo),
      docs: gcv(row, config.col_docs),
      demandante: gcv(row, config.col_demandante),
      juicio: gcv(row, config.col_juicio),
      tribunal: gcv(row, config.col_tribunal),
      pcompra: gcv(row, config.col_pcompra),
      acompra: gcv(row, config.col_acompra),
      superficie: gcv(row, config.col_superficie),
      avaluo: gcv(row, config.col_avaluo),
      contrib: gcv(row, config.col_contrib),
      consig: gcv(row, config.col_consig),
      obs: gcv(row, config.col_obs),
      decision: gcv(row, config.col_decision),
      madj: gcv(row, config.col_madj),
      resultado: gcv(row, config.col_resultado),
      s3: gcv(row, config.col_s3),
    })).filter(r => r.inmueble || r.juicio);

    // Pre-calcular fecha como Date
    allRemates.forEach(r => { r._fecha = parseFechaCell(r.fecha); });

    // Cargar datos de tribunales en paralelo (no bloquea si falla)
    loadDatosTribunales().catch(()=>{});

    // Reset filtros
    selProx = false; selPasado = false; selProxRemate = false;
    selDecSi = false; selDecVer = false; selAdjS3 = false; selFecha = null;

    buildEstadoBar();
    buildFechasFuturasBar();
    applyFilters();
  } catch (e) {
    showError(e.message);
  }
}

// Normaliza nombre de tribunal para hacer match flexible entre hojas:
// - Mayúsculas, sin tildes, sin espacios extra
// - Ignora palabras "CIVIL", "JLC", "JUZGADO", "DE", "LETRAS" que pueden variar
function normTribunal(s) {
  if (!s) return '';
  let t = String(s)
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes
    .replace(/[^A-Z0-9 ]/g, ' ') // quita puntuación
    .replace(/\s+/g, ' ')
    .trim();
  // Quitar palabras opcionales que pueden o no estar
  t = t.replace(/\b(JUZGADO|JUZGADOS|CIVIL|CIVILES|JLC|DE|LETRAS|EN|LO)\b/g, '');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

// ── LOAD DATOS TRIBUNALES ──
async function loadDatosTribunales() {
  try {
    // Pedimos explícitamente las columnas B, C, D y desde la fila 3
    // Pedimos explícitamente las columnas B, C, D y desde la fila 3
    const ts = Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_DATOS_TRIB)}&range=B3:D200&headers=0&_t=${ts}`;
    const res = await fetch(url, {
      cache: 'no-store',
      mode: 'cors',
      credentials: 'omit',
      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
    });
    if (!res.ok) { console.warn('[tribunales] HTTP', res.status); return; }
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) { console.warn('[tribunales] formato inesperado'); return; }
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];
    const cols = json.table.cols || [];

    // DEBUG: imprimir respuesta cruda para ver qué llega exactamente
    console.log('[tribunales] columnas que llegaron:', cols.map(c => c.label || c.id));
    console.log('[tribunales] primera fila completa:', rows[0]);
    console.log('[tribunales] todas las filas:', rows.map(r => r.c ? r.c.map(c => c ? (c.f || c.v) : null) : []));

    const dict = {};
    rows.forEach(row => {
      if (!row.c) return;
      // Con range=B3:D, los índices son: 0=tribunal, 1=rut, 2=cuenta
      const cellTrib = row.c[0];
      const cellRut = row.c[1];
      const cellCta = row.c[2];

      // CRÍTICO: para el tribunal usamos SOLO cell.v (valor crudo).
      // Si usáramos cell.f, podríamos estar trayendo el "valor mostrado" que a veces incluye
      // texto adicional según el formato de la celda.
      const trib = cellTrib && cellTrib.v != null ? String(cellTrib.v).trim() : '';
      const rut = cellRut && cellRut.v != null
        ? String(cellRut.f != null && cellRut.f !== '' ? cellRut.f : cellRut.v).trim()
        : '';
      const cta = cellCta && cellCta.v != null
        ? String(cellCta.f != null && cellCta.f !== '' ? cellCta.f : cellCta.v).trim()
        : '';

      if (!trib) return;
      const key = normTribunal(trib);
      if (!key || key === 'TRIBUNAL') return;
      dict[key] = { rut, cuenta: cta, nombre: trib };
    });
    datosTribunales = dict;
    console.log('[tribunales] cargados:', Object.keys(dict).length, dict);
  } catch(e) {
    console.warn('[tribunales] error:', e);
  }
}

// ── ESTADO BAR (chips de filtro principal) ──
function buildEstadoBar() {
  const bar = document.getElementById('estadoBar');
  bar.innerHTML = '';

  const proxCount = allRemates.filter(r => {
    const d = diasDesde(r._fecha);
    return d !== null && d >= 0;
  }).length;

  const pasadoCount = allRemates.filter(r => {
    const d = diasDesde(r._fecha);
    return d !== null && d < 0;
  }).length;

  const decSiCount = allRemates.filter(r => (r.decision||'').toUpperCase().trim() === 'SI').length;
  const decVerCount = allRemates.filter(r => {
    const d = (r.decision||'').toUpperCase().trim();
    return d === 'VER' || d.includes('VER');
  }).length;

  // Calcular fecha del próximo remate (la más cercana en el futuro, incluyendo hoy)
  let proxRemateKey = null;
  let proxRemateDias = null;
  let proxRemateCount = 0;
  allRemates.forEach(r => {
    const d = diasDesde(r._fecha);
    if (d === null || d < 0) return;
    if (proxRemateDias === null || d < proxRemateDias) {
      proxRemateDias = d;
      const dt = r._fecha;
      proxRemateKey = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    }
  });
  if (proxRemateKey) {
    proxRemateCount = allRemates.filter(r => {
      if (!r._fecha) return false;
      const dt = r._fecha;
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      return key === proxRemateKey;
    }).length;
  }

  // PRÓX. REMATE (siempre primero, destacado)
  if (proxRemateCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-proxremate';
    chip.dataset.key = 'proxremate';
    let etiqueta = 'PRÓX. REMATE';
    if (proxRemateDias === 0) etiqueta = '🔥 HOY';
    else if (proxRemateDias === 1) etiqueta = '⚡ MAÑANA';
    else if (proxRemateDias <= 7) etiqueta = `⚡ EN ${proxRemateDias}D`;
    chip.innerHTML = `<span class="dot"></span>${etiqueta} <span class="n">${proxRemateCount}</span>`;
    chip.addEventListener('click', () => {
      selProxRemate = !selProxRemate;
      chip.classList.toggle('active', selProxRemate);
      // Guardamos la key para usarla al filtrar
      chip.dataset.fechaKey = proxRemateKey;
      applyFilters();
    });
    chip.dataset.fechaKey = proxRemateKey;
    bar.appendChild(chip);
  }

  // PRÓXIMOS
  if (proxCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-prox';
    chip.dataset.key = 'prox';
    chip.innerHTML = `<span class="dot"></span>PRÓXIMOS <span class="n">${proxCount}</span>`;
    chip.addEventListener('click', () => {
      selProx = !selProx;
      chip.classList.toggle('active', selProx);
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // (chip PASADOS eliminado a pedido del usuario)

  // DECISIÓN SI
  if (decSiCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-decsi';
    chip.dataset.key = 'decsi';
    chip.innerHTML = `<span class="dot"></span>DECISIÓN SI <span class="n">${decSiCount}</span>`;
    chip.addEventListener('click', () => {
      selDecSi = !selDecSi;
      chip.classList.toggle('active', selDecSi);
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // DECISIÓN VER
  if (decVerCount > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-decver';
    chip.dataset.key = 'decver';
    chip.innerHTML = `<span class="dot"></span>POR REVISAR <span class="n">${decVerCount}</span>`;
    chip.addEventListener('click', () => {
      selDecVer = !selDecVer;
      chip.classList.toggle('active', selDecVer);
      applyFilters();
    });
    bar.appendChild(chip);
  }

  // ADJ S3 (columna V = SI)
  const adjS3Count = allRemates.filter(r => (r.s3||'').toUpperCase().trim() === 'SI').length;
  if (adjS3Count > 0) {
    const chip = document.createElement('div');
    chip.className = 'chip c-adjs3';
    chip.dataset.key = 'adjs3';
    chip.innerHTML = `<span class="dot"></span>ADJ S3 <span class="n">${adjS3Count}</span>`;
    chip.addEventListener('click', () => {
      selAdjS3 = !selAdjS3;
      chip.classList.toggle('active', selAdjS3);
      applyFilters();
    });
    bar.appendChild(chip);
  }
}

// ── FECHAS FUTURAS BAR ──
function buildFechasFuturasBar() {
  const bar = document.getElementById('abogadoBar');
  bar.innerHTML = '';

  // Agrupar remates futuros (incluye HOY) por fecha
  const grupos = {};
  allRemates.forEach(r => {
    const dias = diasDesde(r._fecha);
    if (dias === null || dias < 0) return;
    // clave = timestamp de día
    const d = r._fecha;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!grupos[key]) grupos[key] = { fecha: d, count: 0, dias };
    grupos[key].count++;
  });

  // Ordenar por fecha ascendente
  const ordenadas = Object.entries(grupos).sort((a,b) => a[0].localeCompare(b[0]));

  if (ordenadas.length === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = '';

  // Btn "Todas"
  const allBtn = document.createElement('button');
  allBtn.className = 'abog-btn active';
  allBtn.dataset.key = 'all';
  const totalFut = ordenadas.reduce((s,[,g]) => s + g.count, 0);
  allBtn.innerHTML = `Todas las fechas <span class="n">${totalFut}</span>`;
  allBtn.addEventListener('click', () => { selFecha = null; syncFechaBtns(); applyFilters(); });
  bar.appendChild(allBtn);

  ordenadas.forEach(([key, g]) => {
    const btn = document.createElement('button');
    btn.className = 'abog-btn';
    btn.dataset.fecha = key;
    const dias = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
    const fechaTxt = `${dias[g.fecha.getDay()]} ${g.fecha.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})}`;
    let prefix = '';
    if (g.dias === 0) prefix = '🔥 HOY · ';
    else if (g.dias === 1) prefix = 'MAÑANA · ';
    btn.innerHTML = `${prefix}${fechaTxt} <span class="n">${g.count}</span>`;
    btn.addEventListener('click', () => {
      selFecha = selFecha === key ? null : key;
      syncFechaBtns();
      applyFilters();
    });
    bar.appendChild(btn);
  });
}

function syncFechaBtns() {
  document.querySelectorAll('#abogadoBar .abog-btn').forEach(btn => {
    const isAll = btn.dataset.key === 'all';
    btn.classList.toggle('active', isAll ? !selFecha : btn.dataset.fecha === selFecha);
  });
}

// ── FILTROS ──
function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  const filtered = allRemates.filter(r => {
    const txt = [r.inmueble, r.demandante, r.juicio, r.tribunal, r.obs, r.consig, r.resultado].join(' ').toLowerCase();
    if (q && !txt.includes(q)) return false;

    if (selProxRemate) {
      const chip = document.querySelector('.chip[data-key="proxremate"]');
      const proxKey = chip ? chip.dataset.fechaKey : null;
      if (!proxKey || !r._fecha) return false;
      const dt = r._fecha;
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if (key !== proxKey) return false;
    }
    if (selProx) {
      const d = diasDesde(r._fecha);
      if (d === null || d < 0) return false;
    }
    if (selPasado) {
      const d = diasDesde(r._fecha);
      if (d === null || d >= 0) return false;
    }
    if (selDecSi && (r.decision||'').toUpperCase().trim() !== 'SI') return false;
    if (selDecVer) {
      const dec = (r.decision||'').toUpperCase().trim();
      if (!(dec === 'VER' || dec.includes('VER'))) return false;
    }
    if (selAdjS3 && (r.s3||'').toUpperCase().trim() !== 'SI') return false;
    if (selFecha) {
      if (!r._fecha) return false;
      const d = r._fecha;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (key !== selFecha) return false;
    }

    return true;
  });

  // Ordenar: fechas más futuras arriba, descendiendo hasta las más antiguas abajo. Sin fecha al final.
  filtered.sort((a, b) => {
    const tA = a._fecha ? a._fecha.getTime() : null;
    const tB = b._fecha ? b._fecha.getTime() : null;
    if (tA === null && tB === null) return 0;
    if (tA === null) return 1;
    if (tB === null) return -1;
    return tB - tA;
  });

  renderCards(filtered);
  updateCounters(q);
}

// ── ACTUALIZAR CONTADORES DE CHIPS ──
// Para cada chip, cuenta cuántos remates quedarían si SOLO se aplicara ese chip
// junto a los OTROS filtros activos (excluyendo el filtro del chip mismo).
// Esto permite combinar filtros de forma útil.
function updateCounters(q) {
  q = (q || '').toLowerCase().trim();

  // Helper: cuenta remates aplicando un set de filtros (igual lógica que applyFilters)
  function countWith(opts) {
    return allRemates.filter(r => {
      const txt = [r.inmueble, r.demandante, r.juicio, r.tribunal, r.obs, r.consig, r.resultado].join(' ').toLowerCase();
      if (q && !txt.includes(q)) return false;

      if (opts.selProxRemate) {
        const chip = document.querySelector('.chip[data-key="proxremate"]');
        const proxKey = chip ? chip.dataset.fechaKey : null;
        if (!proxKey || !r._fecha) return false;
        const dt = r._fecha;
        const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
        if (key !== proxKey) return false;
      }
      if (opts.selProx) {
        const d = diasDesde(r._fecha);
        if (d === null || d < 0) return false;
      }
      if (opts.selDecSi && (r.decision||'').toUpperCase().trim() !== 'SI') return false;
      if (opts.selDecVer) {
        const dec = (r.decision||'').toUpperCase().trim();
        if (!(dec === 'VER' || dec.includes('VER'))) return false;
      }
      if (opts.selAdjS3 && (r.s3||'').toUpperCase().trim() !== 'SI') return false;
      if (opts.selFecha) {
        if (!r._fecha) return false;
        const d = r._fecha;
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (key !== opts.selFecha) return false;
      }

      return true;
    }).length;
  }

  // Estado actual de filtros
  const filtrosActivos = {
    selProxRemate, selProx, selDecSi, selDecVer, selAdjS3, selFecha
  };

  // Para cada chip, contar cuántos remates quedarían si ese chip se aplicara
  // junto a los OTROS filtros activos (excluyendo el del chip mismo).
  function countForChip(chipKey) {
    const opts = { ...filtrosActivos };
    // Encender el filtro del chip mismo (no toggle, sino forzar ON)
    if (chipKey === 'proxremate') opts.selProxRemate = true;
    else if (chipKey === 'prox') opts.selProx = true;
    else if (chipKey === 'decsi') opts.selDecSi = true;
    else if (chipKey === 'decver') opts.selDecVer = true;
    else if (chipKey === 'adjs3') opts.selAdjS3 = true;
    // Apagar todos los OTROS chips del mismo grupo (chip "decsi" no debe combinarse con "decver", etc.)
    // En este caso, decsi/decver son exclusivos entre sí
    if (chipKey === 'decsi') opts.selDecVer = false;
    if (chipKey === 'decver') opts.selDecSi = false;
    // prox y proxremate también son redundantes uno sobre otro
    if (chipKey === 'proxremate') opts.selProx = false;
    if (chipKey === 'prox') opts.selProxRemate = false;
    return countWith(opts);
  }

  // Actualizar el badge de cada chip
  document.querySelectorAll('.chip').forEach(chip => {
    const key = chip.dataset.key;
    if (!key) return;
    const span = chip.querySelector('.n');
    if (!span) return;
    const n = countForChip(key);
    span.textContent = n;
    // Si el chip NO está activo y su contador es 0 → ocultar.
    // Si está activo, dejarlo visible aunque sea 0 (para que el usuario pueda desactivarlo).
    const estaActivo = chip.classList.contains('active');
    chip.style.display = (n === 0 && !estaActivo) ? 'none' : '';
  });

  // Actualizar el badge de cada botón de fecha (abogado-bar)
  document.querySelectorAll('#abogadoBar .abog-btn').forEach(btn => {
    const span = btn.querySelector('.n');
    if (!span) return;
    let n;
    if (btn.dataset.key === 'all') {
      const opts = { ...filtrosActivos, selFecha: null };
      n = countWith(opts);
    } else {
      const fechaKey = btn.dataset.fecha;
      const opts = { ...filtrosActivos, selFecha: fechaKey };
      n = countWith(opts);
    }
    span.textContent = n;
    // Ocultar botones de fecha con 0 (salvo "Todas las fechas" y el activo)
    const estaActivo = btn.classList.contains('active');
    const esTodas = btn.dataset.key === 'all';
    btn.style.display = (n === 0 && !estaActivo && !esTodas) ? 'none' : '';
  });
}

function renderCards(list) {
  const main = document.getElementById('mainContent');
  const info = document.getElementById('resultsInfo');
  info.textContent = `${list.length} remate${list.length===1?'':'s'}`;

  if (list.length === 0) {
    main.innerHTML = `<div class="state-box"><div class="icon">🔍</div><h3>Sin resultados</h3><p>Ajusta los filtros o la búsqueda</p></div>`;
    return;
  }

  main.innerHTML = list.map(r => {
    const dias = diasDesde(r._fecha);
    let badgeHtml = '';
    let stripeColor = 'var(--muted)';
    if (dias !== null) {
      if (dias === 0) {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#ef4444">HOY</span>`;
        stripeColor = '#ef4444';
      } else if (dias > 0 && dias <= 7) {
        badgeHtml = `<span class="sbadge" style="color:#0b1220;background:#fbbf24">EN ${dias}D</span>`;
        stripeColor = '#fbbf24';
      } else if (dias > 7) {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#10b981">${dias}D</span>`;
        stripeColor = '#10b981';
      } else {
        badgeHtml = `<span class="sbadge" style="color:#fff;background:#64748b">PASÓ</span>`;
        stripeColor = '#64748b';
      }
    }

    const dec = (r.decision||'').toUpperCase().trim();
    const cardClass = dec === 'SI' ? 'card dec-si' : (dec === 'NO' ? 'card dec-no' : 'card');

    const tags = [];
    if ((r.zoom||'').toUpperCase().trim() === 'SI') tags.push('<span class="tag zoom">📹 ZOOM</span>');
    if (dec === 'SI') tags.push('<span class="tag dec-si">✓ DECISIÓN SI</span>');
    else if (dec === 'NO') tags.push('<span class="tag">✗ NO</span>');
    else if (dec.includes('VER')) tags.push('<span class="tag dec-ver">⚠ POR VER</span>');

    const fechaGrande = r._fecha ? formatFechaGrande(r._fecha) : '(sin fecha)';
    const horaTxt = formatHora(r.hora);

    const mapsBtn = isUrl(r.ubicacion)
      ? `<a class="card-maps" href="${escapeHtml(r.ubicacion)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Mapa</a>`
      : '';

    return `
      <div class="${cardClass}" style="--sc:${stripeColor}" data-id="${r.id}" onclick="openDetail(${r.id})">
        <div class="card-top">
          <div class="card-fecha-big">${fechaGrande}${horaTxt ? ` <span class="card-hora">${horaTxt}</span>` : ''}</div>
          ${badgeHtml}
        </div>
        <div class="card-name">${escapeHtml(r.inmueble || '(sin inmueble)')}</div>
        <div class="card-sub">${escapeHtml(r.juicio||'')}${r.tribunal?' · '+escapeHtml(r.tribunal):''}</div>
        ${tags.length ? `<div class="card-tags">${tags.join('')}</div>` : ''}
        <div class="card-foot">
          <span class="cmonto">${formatMonto(r.minimo)}</span>
          ${mapsBtn}
        </div>
      </div>
    `;
  }).join('');
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

function copyText(txt, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      }
    }).catch(() => fallbackCopy(txt, btn));
  } else {
    fallbackCopy(txt, btn);
  }
}

function fallbackCopy(txt, btn) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    }
  } catch(e) {}
  document.body.removeChild(ta);
}

// MÓDULO GASTOS
// ═══════════════════════════════════════════════
let gastosData = [];      // array de {detalle, gasto, abono, monto, aportante, tipo}
let filtroAportante = ''; // '' = todos

const COLORES_PIE = ['#f97316', '#10b981', '#3b82f6', '#a78bfa', '#fbbf24', '#ef4444', '#14b8a6', '#ec4899', '#8b5cf6'];

async function loadGastos() {
  document.getElementById('gastosDetalle').innerHTML = `<div class="state-box"><div class="spinner"></div><p>Cargando gastos…</p></div>`;
  try {
    const ts = Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=GASTOS&range=A2:F500&_t=${ts}`;
    const res = await fetch(url, {
      cache: 'no-store',
      mode: 'cors',
      credentials: 'omit',
      headers: { 'Cache-Control': 'no-cache' }
    });
    const txt = await res.text();
    const jsonMatch = txt.match(/setResponse\((.*)\)/s);
    if (!jsonMatch) throw new Error('Formato de respuesta inesperado');
    const data = JSON.parse(jsonMatch[1]);
    const rows = data.table.rows || [];

    gastosData = rows.map(row => {
      const c = row.c || [];
      const get = (i) => {
        const cell = c[i];
        if (!cell) return '';
        const v = (cell.f !== null && cell.f !== undefined && cell.f !== '') ? cell.f : cell.v;
        return v == null ? '' : String(v).trim();
      };
      const getNum = (i) => {
        const cell = c[i];
        if (!cell || cell.v == null) return 0;
        const n = parseFloat(cell.v);
        return isNaN(n) ? 0 : n;
      };
      return {
        detalle: get(0),
        gasto: get(1).toUpperCase(),
        abono: get(2).toUpperCase(),
        monto: getNum(3),
        aportante: get(4),
        tipo: get(5)
      };
    }).filter(r => r.detalle || r.monto > 0);

    renderGastos();
  } catch (err) {
    document.getElementById('gastosDetalle').innerHTML = `<div class="state-box"><div class="icon">⚠️</div><h3>Error al cargar</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
}

function calcularSaldos() {
  // Por cada aportante: suma monto GASTO=SI y resta monto ABONO=SI
  const saldos = {};
  gastosData.forEach(r => {
    if (!r.aportante) return;
    if (!saldos[r.aportante]) saldos[r.aportante] = { egresos: 0, abonos: 0, saldo: 0 };
    if (r.gasto === 'SI') saldos[r.aportante].egresos += r.monto;
    if (r.abono === 'SI') saldos[r.aportante].abonos += r.monto;
  });
  Object.keys(saldos).forEach(k => {
    saldos[k].saldo = saldos[k].egresos - saldos[k].abonos;
  });
  return saldos;
}

function renderGastos() {
  const saldos = calcularSaldos();
  const aportantes = Object.keys(saldos).sort();

  // Sección de saldos con reembolsos
  const totalEgresos = aportantes.reduce((s, k) => s + saldos[k].egresos, 0);
  const promedio = aportantes.length > 0 ? totalEgresos / aportantes.length : 0;

  let saldosHtml = `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px">`;
  saldosHtml += `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Saldos</div>`;
  aportantes.forEach(k => {
    const s = saldos[k];
    const dif = s.saldo - promedio;
    const aFavor = dif > 0;
    const debe = dif < 0;
    const color = aFavor ? '#10b981' : debe ? '#ef4444' : 'var(--muted)';
    const etiqueta = aFavor ? `a favor $${formatoNumero(dif)}` : debe ? `debe reembolsar $${formatoNumero(-dif)}` : 'equilibrado';
    saldosHtml += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border)">
      <div>
        <div style="font-weight:700">${escapeHtml(k)}</div>
        <div style="font-size:11px;color:var(--muted)">Aportado: $${formatoNumero(s.egresos)}${s.abonos ? ` · Reembolsado: $${formatoNumero(s.abonos)}` : ''}</div>
      </div>
      <div style="color:${color};font-weight:700;font-family:var(--mono);font-size:13px">${etiqueta}</div>
    </div>`;
  });
  saldosHtml += `</div>`;
  document.getElementById('gastosSaldos').innerHTML = saldosHtml;

  // Gráfico de torta (proporcional a EGRESOS de cada aportante)
  renderPie(aportantes, saldos);

  // Chips por aportante + Todos
  let chipsHtml = `<div class="chip ${filtroAportante === '' ? 'active' : ''}" data-aportante="" style="background:${filtroAportante === '' ? 'var(--accent)' : 'var(--surface2)'};color:${filtroAportante === '' ? '#fff' : 'var(--text)'}"><span>TODOS</span> <span class="n">${gastosData.length}</span></div>`;
  aportantes.forEach((k, i) => {
    const color = COLORES_PIE[i % COLORES_PIE.length];
    const activo = filtroAportante === k;
    chipsHtml += `<div class="chip ${activo ? 'active' : ''}" data-aportante="${escapeHtml(k)}" style="background:${activo ? color : 'var(--surface2)'};color:${activo ? '#fff' : 'var(--text)'};border-color:${color}">
      <span style="width:8px;height:8px;background:${color};border-radius:50%;display:inline-block;margin-right:6px"></span>
      <span>${escapeHtml(k)}</span>
      <span class="n">$${formatoNumero(saldos[k].egresos)}</span>
    </div>`;
  });
  document.getElementById('gastosChips').innerHTML = chipsHtml;

  // Click handlers en chips
  document.querySelectorAll('#gastosChips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filtroAportante = chip.dataset.aportante;
      renderGastos();
    });
  });

  // Detalle de gastos (formato tarjeta similar a remates)
  const filtrados = filtroAportante ? gastosData.filter(r => r.aportante === filtroAportante) : gastosData;
  if (filtrados.length === 0) {
    document.getElementById('gastosDetalle').innerHTML = `<div class="state-box"><p>No hay gastos para mostrar</p></div>`;
    return;
  }

  let detalleHtml = `<div style="font-size:11px;color:var(--muted);margin-bottom:8px">${filtrados.length} registros</div>`;
  filtrados.forEach(r => {
    const esGasto = r.gasto === 'SI';
    const esAbono = r.abono === 'SI';
    const color = esGasto ? '#ef4444' : esAbono ? '#10b981' : 'var(--muted)';
    const signo = esGasto ? '-' : esAbono ? '+' : '';
    const tipoTag = r.tipo ? `<span class="tag">${escapeHtml(r.tipo)}</span>` : '';
    detalleHtml += `<div class="card" style="border-color:var(--border)">
      <div class="card-top">
        <div style="flex:1">
          <div class="card-name">${escapeHtml(r.detalle) || 'Sin detalle'}</div>
          <div class="card-sub">${escapeHtml(r.aportante) || '—'}</div>
        </div>
        <div style="font-family:var(--mono);font-weight:800;color:${color};font-size:16px">${signo}$${formatoNumero(r.monto)}</div>
      </div>
      ${tipoTag ? `<div class="card-tags">${tipoTag}</div>` : ''}
    </div>`;
  });
  document.getElementById('gastosDetalle').innerHTML = detalleHtml;
}

function renderPie(aportantes, saldos) {
  const svg = document.getElementById('gastosPie');
  const total = aportantes.reduce((s, k) => s + saldos[k].egresos, 0);
  if (total === 0) {
    svg.innerHTML = `<circle cx="120" cy="120" r="90" fill="none" stroke="var(--border)" stroke-width="2"/><text x="120" y="125" text-anchor="middle" fill="var(--muted)" font-size="13">Sin datos</text>`;
    return;
  }
  const cx = 120, cy = 120, r = 90;
  let acc = 0;
  let paths = '';
  aportantes.forEach((k, i) => {
    const monto = saldos[k].egresos;
    if (monto === 0) return;
    const startAngle = (acc / total) * 2 * Math.PI - Math.PI / 2;
    acc += monto;
    const endAngle = (acc / total) * 2 * Math.PI - Math.PI / 2;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    const color = COLORES_PIE[i % COLORES_PIE.length];
    // Etiqueta
    const midAngle = (startAngle + endAngle) / 2;
    const lx = cx + (r * 0.65) * Math.cos(midAngle);
    const ly = cy + (r * 0.65) * Math.sin(midAngle);
    const pct = Math.round((monto / total) * 100);
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (pct >= 5) {
      paths += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="14" font-weight="700">${pct}%</text>`;
    }
  });
  svg.innerHTML = paths;
}

function formatoNumero(n) {
  return Math.round(n).toLocaleString('es-CL');
}

// Handlers del modal
document.getElementById('btnGastos').addEventListener('click', () => {
  document.getElementById('gastosOverlay').classList.add('open');
  loadGastos();
});
document.getElementById('btnCloseGastos').addEventListener('click', () => closeOverlay('gastosOverlay'));
document.getElementById('gastosOverlay').addEventListener('click', e => {
  if (e.target.id === 'gastosOverlay') closeOverlay('gastosOverlay');
});
